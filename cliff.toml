[changelog]
header = ""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}
    {% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
topo_order = false

commit_preprocessors = [
    { pattern = '^\\[Forward [^]]+\\] ', skip = true },
    { pattern = 'Forward', skip = true },
    { pattern = '^docs: use version ', skip = true },
]

commit_parsers = [
    { field = "author.name", pattern = "dependabot\\[bot\\]", skip = true },
    { field = "author.name", pattern = "github-actions\\[bot\\]", skip = true },
    { message = '^docs: use version ', skip = true },
    { message = '^feat', group = 'Added' },
    { message = '^fix', group = 'Fixed' },
    { message = '^perf', group = 'Changed' },
    { message = '^refactor', group = 'Changed' },
    { message = '^revert', group = 'Removed' },
    { message = '^ci:', skip = true },
    { message = '^chore', skip = true },
    { message = '^docs', skip = true },
    { message = '^test', skip = true },
    { message = '^build', skip = true },
    { message = '^style', skip = true },
    { message = 'Forward', skip = true },
    { message = '^.*', group = 'Changed' },
]

[remote.github]
owner = "nikolas-charalambidis"
repo = "facepalm-maven-plugin"
