name: Forward to master

# Every push to a release/X.Y.x branch is forward-ported to master through pull requests,
# one forward PR per source PR (the model of korthout/backport-action and Mergify).
#
# - Each pushed commit is mapped to the merged PR it came from. Its commits are cherry-picked with -x
#   onto "forward/<pr>-to-master", and a PR "[Forward master] <source PR title>" is opened.
#   Closing keywords (Fixes/Closes/Resolves #N) are copied from the source PR, so the issues close
#   when the forward PR is merged into master (keywords only work on the default branch).
# - Commits pushed directly (no PR) are forwarded together as one PR per push, without closing keywords.
# - Commits whose message contains [no-forward] are skipped.
# - Commits whose change is already on master (empty cherry-pick) are skipped.
# - On conflict, the conflicting commit is committed WITH conflict markers, the PR becomes a draft,
#   and the remaining commits are listed in the PR for manual cherry-picking.
# - An existing forward branch is never overwritten, so re-running the workflow is safe.
#
# Requires a GitHub App (Contents, Pull requests, Workflows: read & write) installed on this repository,
# with secrets FORWARD_APP_ID and FORWARD_APP_PRIVATE_KEY. The App token (unlike GITHUB_TOKEN) makes the PR trigger build.yaml.

on:
  push:
    branches: [ 'release/**' ]

concurrency:
  group: forward-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forward:
    name: Forward-port to master
    runs-on: ubuntu-latest
    # Skip branch creation pushes (no "before" commit to diff against).
    if: github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FORWARD_APP_ID }}
          private-key: ${{ secrets.FORWARD_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # All branches and history for cherry-picking
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git as the App Bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: Forward Each Source PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Closing keywords (Fixes/Closes/Resolves #N) found in a PR body, one per line.
          closing_keywords() {
            grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
              | sed -E 's/^[^[:alpha:]]//; s/:?[[:space:]]+/ /' | awk '!seen[tolower($0)]++' || true
          }

          # Cherry-picks the given commits onto a fresh branch from master and opens one forward PR.
          # $1 = source PR number, or "push" for commits pushed without a PR; remaining args = commits.
          forward_group() {
            local KEY=$1; shift
            local FIRST=$1 LAST=${!#} FORWARD TITLE INTRO KEYWORDS=""
            if [ "$KEY" = "push" ]; then
              FORWARD="forward/${FIRST:0:7}-to-master"
              if [ $# -eq 1 ]; then
                TITLE="[Forward master] $(git log -1 --format=%s "$FIRST")"
              else
                TITLE="[Forward master] $SOURCE ${FIRST:0:7}..${LAST:0:7}"
              fi
              INTRO="Forward-port of commits pushed directly to \`$SOURCE\` to \`master\`."
            else
              FORWARD="forward/${KEY}-to-master"
              TITLE="[Forward master] $(gh api "repos/$GITHUB_REPOSITORY/pulls/$KEY" --jq .title)"
              INTRO="Forward-port of #$KEY from \`$SOURCE\` to \`master\`."
              KEYWORDS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$KEY" --jq '.body // ""' | closing_keywords)
            fi

            if git ls-remote --exit-code --heads origin "$FORWARD" >/dev/null; then
              echo "::notice::$FORWARD already exists, skipping."
              return
            fi

            git checkout -B "$FORWARD" origin/master
            local C LINE PICKED="" SKIPPED="" CONFLICT="" REMAINING=""
            for C in "$@"; do
              LINE="- $(git log -1 --format='%h %s' "$C")"
              if [ -n "$CONFLICT" ]; then
                REMAINING+="$C "; continue
              fi
              if git log -1 --format=%B "$C" | grep -qF '[no-forward]'; then
                SKIPPED+="$LINE ([no-forward])"$'\n'; continue
              fi
              if git cherry-pick -x "$C"; then
                PICKED+="$LINE"$'\n'; continue
              fi
              if [ -z "$(git status --porcelain --untracked-files=no)" ]; then
                # Empty result: the change is already on master.
                git cherry-pick --skip
                SKIPPED+="$LINE (already on master)"$'\n'; continue
              fi
              # Conflict: keep the markers in a commit so it can be resolved on the PR branch.
              git add -A
              git -c core.editor=true cherry-pick --continue
              CONFLICT="$LINE"
            done

            if [ -z "$PICKED" ] && [ -z "$CONFLICT" ]; then
              echo "Nothing to forward for $KEY."
              return
            fi

            git push origin "$FORWARD"

            {
              echo "$INTRO"
              echo
              if [ -n "$KEYWORDS" ]; then echo "$KEYWORDS"; echo; fi
              if [ -n "$PICKED" ]; then echo "**Forwarded:**"; echo "$PICKED"; fi
              if [ -n "$SKIPPED" ]; then echo "**Skipped:**"; echo "$SKIPPED"; fi
              if [ -n "$CONFLICT" ]; then
                echo "**Conflict** — committed with conflict markers, the build will fail until resolved:"
                echo "$CONFLICT"
                echo
                echo '```bash'
                echo "git fetch origin && git checkout $FORWARD"
                echo "# resolve the conflict markers, then:"
                echo "git commit -am \"fix: resolve forward-port conflict\""
                if [ -n "$REMAINING" ]; then echo "git cherry-pick -x $REMAINING"; fi
                echo "git push"
                echo '```'
                echo
                echo "Then mark this PR as ready for review."
                echo
              fi
              echo "Merge with **Rebase and merge** to keep each \`(cherry picked from commit …)\` line. Commits containing \`[no-forward]\` are never forwarded."
            } > "$RUNNER_TEMP/body.md"

            local DRAFT=""; [ -n "$CONFLICT" ] && DRAFT="--draft"
            gh pr create --base master --head "$FORWARD" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" $DRAFT
          }

          # Group consecutive commits by the merged PR (into this branch) they came from.
          KEY=""; GROUP=()
          for C in $(git rev-list --reverse --no-merges "$BEFORE..$AFTER"); do
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$C/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"$SOURCE\")][0].number // empty")
            NEXT="${PR:-push}"
            if [ ${#GROUP[@]} -gt 0 ] && [ "$NEXT" != "$KEY" ]; then
              forward_group "$KEY" "${GROUP[@]}"
              GROUP=()
            fi
            KEY="$NEXT"; GROUP+=("$C")
          done
          if [ ${#GROUP[@]} -gt 0 ]; then
            forward_group "$KEY" "${GROUP[@]}"
          fi
