name: CodeQL

# CodeQL code scanning (advanced setup) for the Java sources and the GitHub Actions workflows.
# Results appear in the Security tab and as annotations on pull requests.
# build-mode "none" analyses Java without compiling it, so no Maven build is needed here.
# Repository default setup must stay disabled; it cannot run alongside this workflow.

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
  schedule:
    - cron: '30 5 * * 1' # Weekly, Monday 05:30 UTC, to pick up new queries
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # Normally ~2 min; fail fast instead of hanging up to 6 h when Maven Central throttles
    permissions:
      security-events: write # Upload results to code scanning
      actions: read          # Read workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin, actions ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode "none" still resolves dependencies through Maven into ~/.m2/repository. Restore the cache that
      # build.yaml fills (same key), so they are not downloaded from Maven Central, which may answer 429.
