name: Build & Site

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
    # labeled/unlabeled re-run the changed-line coverage gate when the coverage-exempt label changes (#370).
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch: # Manual trigger.

# Read-only by default: the "ci" job builds pull request code. Only the "site" job gets Pages permissions.
permissions:
  contents: read

jobs:
  ci:
    name: CI / Verify & Build Site
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # Normally 2-3 min
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Nothing is pushed; keep the token out of .git/config.
          fetch-depth: 2 # On a PR, HEAD is the merge commit; HEAD^1 is the base it is diffed against for changed-line coverage.

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 # zizmor: ignore[cache-poisoning] PR caches are scoped to the PR ref and never restored on master or release/**
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # We combined `verify` and `site` into one fast sequential command.
      # Because Maven naturally fails fast, if `verify` fails (e.g., test fails, PMD fails Priority 1/2, Spotless check fails),
      # the pipeline completely aborts, and the slow `site` generation phase NEVER RUNS.
      # This guarantees quick error feedback for PRs, while generating the site organically if the build succeeds.
      - name: Build, Verify, & Generate Site
        run: mvn -B clean verify site

      # FacepalmMojoIT runs concurrently (#416): the console output of the forked builds interleaves.
      - name: Upload Integration Test Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: it-logs-ci
          path: target/maven-it/**/mvn-*.log
          retention-days: 7

      # The committed dump of the plugin contract (#338) must match the build, so every change to goals, parameters,
      # -D properties, types or defaults shows up as a reviewed diff. The "SemVer" workflow compares it with the release.
      - name: Plugin Contract Up to Date
        run: |
          python3 .github/scripts/semver-check.py dump target/classes/META-INF/maven/plugin.xml > "$RUNNER_TEMP/plugin-contract.txt"
          if ! diff -u src/main/contract/plugin-contract.txt "$RUNNER_TEMP/plugin-contract.txt"; then
            echo "::error file=src/main/contract/plugin-contract.txt,title=Plugin contract::Stale; regenerate it with: python3 .github/scripts/semver-check.py dump target/classes/META-INF/maven/plugin.xml > src/main/contract/plugin-contract.txt"
            exit 1
          fi

      # Overall and changed-line coverage of the PR (#335), from the JaCoCo XML of the site, in the job summary.
      # Uncovered changed lines are annotated in the diff; below 80% of changed lines it fails the job (#370), unless the
      # PR carries the coverage-exempt label (the reason belongs in the PR description).
      # No PR comment: it would need pull-requests: write, which PRs from forks do not get. No third-party service.
      - name: Changed-Line Coverage
        if: github.event_name == 'pull_request' && success()
        env:
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-exempt') }}
        run: |
          args=(target/site/jacoco/jacoco.xml HEAD^1 --min 80)
          if [ "$EXEMPT" = true ]; then args+=(--exempt); fi
          python3 .github/scripts/changed-line-coverage.py "${args[@]}"

      # Coverage badges (jacoco.svg, branches.svg) from the JaCoCo CSV of the site, published with the site under badges/.
      # Self-hosted: no third-party coverage service, no secret, no commit from CI.
      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/master' && success()
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: target/site/badges
          generate-branches-badge: true

      # We don't need to manually upload raw XMLs anymore since Maven Site built the HTML locally in the step above.
      # Upload the final HTML pages artifact immediately.
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master' && success() # CRITICAL: Only upload the site artifact if on master and the build passed.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  # Compatibility matrix (#337): unit tests on each JDK, and the integration tests (facepalm:scan and facepalm:report in
  # forked Maven builds) on each supported Maven. Separate from "ci", so the required check name stays stable.
  # All combinations run in parallel with each other and with "ci" (no "needs"); fail-fast is off so each one reports.
  # The build itself needs Maven 3.9+ (enforcer), so it always runs on BUILD_MAVEN; -Dits.maven.home points the
  # integration tests at the Maven under test.
  compat:
    name: Compat / JDK ${{ matrix.java }}, Maven ${{ matrix.maven }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # Normally 5-10 min; Windows is the slowest
    # A label change does not change the code: only "ci" re-runs, for the coverage-exempt label (#370).
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    # Maven 4 is a release candidate (#365): its jobs may not fail the run until 4.0.0 is GA. Then pin the GA version
    # and its SHA-512 below, and remove this line.
    continue-on-error: ${{ startsWith(matrix.maven, '4.') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04 ]
        java: [ '17', '21', '25' ]
        maven: [ '3.6.3', '3.9.16', '4.0.0-rc-7' ]
        # The "ci" job already runs this verify on JDK 17 with Maven 3.9 on Ubuntu (#416).
        exclude:
          - os: ubuntu-26.04
            java: '17'
            maven: '3.9.16'
        include:
          - os: windows-latest
            java: '17'
            maven: '3.9.16'
          - os: macos-latest
            java: '17'
            maven: '3.9.16'
    env:
      BUILD_MAVEN: '3.9.16'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Nothing is pushed; keep the token out of .git/config.

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 # zizmor: ignore[cache-poisoning] PR caches are scoped to the PR ref and never restored on master or release/**
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      # The parallel matrix hit Maven Central's rate limit (HTTP 429) when every job downloaded the distributions (#421).
      # A restored archive is checked against the pinned SHA-512 like a downloaded one, so the cache cannot inject
      # another Maven.
      - name: Cache Maven Distributions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] every restored archive is verified against the pinned SHA-512 before use
        with:
          path: ${{ runner.temp }}/maven-dist
          key: maven-dist-${{ runner.os }}-${{ env.BUILD_MAVEN }}-${{ matrix.maven }}

      # Downloads the pinned Maven distributions (unless cached) and checks them against the SHA-512 below
      # (equal to the published apache-maven-<version>-bin.tar.gz.sha512).
      - name: Install Maven ${{ matrix.maven }} (and ${{ env.BUILD_MAVEN }} to build)
        env:
          TARGET_MAVEN: ${{ matrix.maven }}
        run: |
          # A function, not an associative array: macOS runners ship bash 3.2.
          sha512_of() {
            case "$1" in
              3.6.3) echo c35a1803a6e70a126e80b2b3ae33eed961f83ed74d18fcd16909b2d44d7dada3203f1ffe726c17ef8dcca2dcaa9fca676987befeadc9b9f759967a8cb77181c0 ;;
              3.9.16) echo 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6 ;;
              4.0.0-rc-7) echo 17b886c0ffb7ec225e514afa8179b3143d855d196cfbb4607ece6272a9b4f51501a389438ab6841b393a4b1391a1b714f07f450daba1951f53f732b400338184 ;;
              *) echo "::error::No SHA-512 pinned for Maven $1" >&2; return 1 ;;
            esac
          }
          TEMP=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          TOOLS="$TEMP/maven"
          DIST="$TEMP/maven-dist" # Cached by the previous step
          mkdir -p "$TOOLS" "$DIST"
          for v in "$BUILD_MAVEN" "$TARGET_MAVEN"; do
            [ -d "$TOOLS/apache-maven-$v" ] && continue
            name="apache-maven-$v-bin.tar.gz"
            archive="$DIST/$name"
            if [ -f "$archive" ]; then
              echo "Maven $v: using the cached archive."
            else
              # A fixed 20 s delay outlasts a short rate-limit window, unlike curl's default 1-16 s backoff.
              # If Maven Central still refuses, the Apache archive serves the same file (same SHA-512).
              curl -fsSL --retry 6 --retry-delay 20 --retry-max-time 300 -o "$archive" \
                "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$v/$name" \
              || curl -fsSL --retry 6 --retry-delay 20 --retry-max-time 300 -o "$archive" \
                "https://archive.apache.org/dist/maven/maven-${v%%.*}/$v/binaries/$name"
            fi
            expected=$(sha512_of "$v")
            actual=$( (sha512sum "$archive" 2>/dev/null || shasum -a 512 "$archive") | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              rm -f "$archive"
              echo "::error::SHA-512 mismatch for Maven $v: $actual"
              exit 1
            fi
            tar -xzf "$archive" -C "$TOOLS"
          done
          # The integration tests start Maven from Java, which needs a native path on Windows.
          TARGET_HOME="$TOOLS/apache-maven-$TARGET_MAVEN"
          {
            echo "BUILD_MVN=$TOOLS/apache-maven-$BUILD_MAVEN/bin/mvn"
            echo "TARGET_HOME=$(cygpath -w "$TARGET_HOME" 2>/dev/null || echo "$TARGET_HOME")"
          } >> "$GITHUB_ENV"
          "$TARGET_HOME/bin/mvn" -v

      - name: Verify (unit tests and integration tests on Maven ${{ matrix.maven }})
        run: '"$BUILD_MVN" -B -ntp verify -Dits.maven.home="$TARGET_HOME"'

      # FacepalmMojoIT runs concurrently (#416), so the console output of the forked builds interleaves; each build's
      # own log is in its test directory.
      - name: Upload Integration Test Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: it-logs-${{ matrix.os }}-jdk${{ matrix.java }}-maven${{ matrix.maven }}
          path: target/maven-it/**/mvn-*.log
          retention-days: 7

  # REUSE (#342): every tracked file must have copyright and license information, from its own SPDX header
  # (Java files, see license.header) or from REUSE.toml, and every license used must have its text in LICENSES/.
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # Normally under 1 min
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled' # As in "compat".
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Nothing is pushed; keep the token out of .git/config.

      - name: REUSE Lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # This job is now PURELY for deployment, not generation.
  # We do not need to set up Java or parse XMLs here. It just grabs the artifact and pushes it.
  site:
    name: Deploy Site to GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # Normally under 1 min
    if: github.ref == 'refs/heads/master' # Master branch only.
    needs: ci # It requires artifacts from the "ci" job to be downloaded and used for site report.
    permissions:
      pages: write    # Deploy to GitHub Pages
      id-token: write # Verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # This automatically pulls the artifact uploaded by 'actions/upload-pages-artifact' in the CI job.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
