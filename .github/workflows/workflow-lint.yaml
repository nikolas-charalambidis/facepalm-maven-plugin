name: Workflow Lint

# Lints the GitHub Actions workflows (#345):
# - actionlint: syntax, expressions, and shellcheck on run: scripts (the image bundles shellcheck). Config: .github/actionlint.yaml.
# - zizmor: security audits such as template injection, excessive permissions, unpinned actions and credential persistence.
#   A finding that is accepted on purpose is silenced inline with "# zizmor: ignore[<audit>]" and the reason.
#
# Runs on every pull request, not only on those that change .github/**: it takes seconds, and a required check
# filtered by paths would never report on other pull requests and block them.

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
  workflow_dispatch: # Manual trigger.

permissions:
  contents: read

jobs:
  lint:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # Normally under 1 min
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Nothing is pushed; keep the token out of .git/config.

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false # Fail this job on findings instead of only uploading them to code scanning.
          annotations: true
