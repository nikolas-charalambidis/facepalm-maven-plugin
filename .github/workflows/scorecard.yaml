name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain security practices (branch protection, pinned
# dependencies, token permissions, signed releases, ...). Results go to code scanning (Security tab) and are
# published to the OpenSSF API, which backs the README badge.
#
# publish_results restricts this workflow: read-only top-level permissions, no env/containers in the job,
# and only approved actions. Actions are pinned by commit SHA (version in the comment).

on:
  # Re-evaluate when branch protection changes.
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1' # Weekly, Monday 04:30 UTC
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Upload results to code scanning
      id-token: write        # Publish results to the OpenSSF API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
