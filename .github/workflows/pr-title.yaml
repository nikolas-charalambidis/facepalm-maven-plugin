name: PR Title

# Checks that the pull request title is a Conventional Commits subject with a type from CONTRIBUTING.md (#346).
# The title becomes the commit subject on a squash merge, and the release notes (#336), the PR labels and the
# forward-port tooling rely on it. The forward PRs of facepalm-bot ("[Forward <line>] <title>") are accepted: their
# title was checked on the original PR.

on:
  pull_request:
    branches: [ master, 'release/**' ]
    types: [ opened, edited, synchronize, reopened ]

permissions: {}

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # Normally under 10 s
    steps:
      - name: Check the Title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # type, optional (scope), optional "!", colon, one space, then the description.
          re='^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([a-z0-9._/-]+\))?!?: [^ ]'
          if [[ "$TITLE" =~ ^\[Forward\ [^]]+\]\  ]]; then
            echo "Forward PR: the title was checked on the original PR."
          elif [[ "$TITLE" =~ $re ]]; then
            echo "Conventional Commits title: OK."
          else
            # The title is printed on its own line, never inside a workflow command.
            printf 'Title: %s\n' "$TITLE"
            echo "::error title=PR title::The PR title is not a Conventional Commits subject. Use '<type>[(scope)][!]: <description>' with a type from CONTRIBUTING.md: feat, fix, perf, refactor, test, docs, build, ci, chore. Example: 'fix: mask short secrets in the report'."
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::warning title=PR title::The title has ${#TITLE} characters; keep it under about 72."
          fi
