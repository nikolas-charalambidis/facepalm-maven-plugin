name: Release & Deploy

# The version is never stored in pom.xml (it holds the ${revision} placeholder).
# It is derived from the latest vX.Y.Z tag reachable from the selected branch, bumped by the chosen type,
# passed to Maven as -Drevision, and recorded only as a git tag. No commits are pushed back.
# Run it from the branch you want to release (master or release/X.Y.x) via the "Use workflow from" selector.
#
# Recovery: the tag is pushed right after the upload to Maven Central. If a later step fails (provenance, GitHub
# Release, docs PR), use "Re-run jobs" on the failed run, or run the workflow again on the same branch while its head
# is still the released commit. The run sees that the commit is already tagged vX.Y.Z and resumes that release: it
# ignores the bump type, uploads nothing to Central, pushes no tag, rebuilds and signs the same reproducible jars, and
# runs only the remaining steps. An existing GitHub Release is kept. A failure before the tag push uploaded nothing
# or left an unpublished deployment: drop it in the Central Portal, then re-run.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release at a time: concurrent runs would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; write access is granted on the job that needs it (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  release:
    name: Automate Release and Tag
    permissions:
      contents: write     # Push the release tag and create the GitHub Release
      id-token: write     # Sign the build provenance attestation (Sigstore)
      attestations: write # Store the attestation on GitHub
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # Normally 1-3 min; more than usual because Maven Central validation of the upload can take a while
    steps:
      # Secrets never coexist with test execution: tests run first without any credentials, GPG key or persisted
      # git token; the signing key and Central credentials are installed only afterwards, and the deploy skips tests.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches all history and tags so git describe works
          persist-credentials: false # The token is passed to the tag push only, not stored in .git/config.

      # No Maven cache: the release job must not restore a ~/.m2 shared with pull request builds before it imports
      # the signing key and uploads to Central. Resolving the dependencies afresh costs about a minute per release.
      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Git Bot User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Install git-cliff v2.8.0 (pinned version, verified SHA512 checksum)
      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.8.0/git-cliff-v2.8.0-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/git-cliff.tar.gz
          echo "42ec0d423098f28115d38af7f95c9248ed2127c7903f16ef6558dcd6e5f625417c7a9a7bbc3b297f63db966d2196d89c2cd0d44c59a7eeb1d3daa0ce1  /tmp/git-cliff.tar.gz" | sha512sum -c -
          tar -xz -C /tmp -f /tmp/git-cliff.tar.gz
          install -m 755 /tmp/git-cliff-2.8.0/git-cliff /usr/local/bin/git-cliff
          rm -rf /tmp/git-cliff-2.8.0 /tmp/git-cliff.tar.gz
          git-cliff --version

      # Step 1: Derive the release version from the latest reachable tag and the chosen bump type
      - name: Calculate Release Version
        id: release_version
        env:
          BUMP: ${{ github.event.inputs.bump_type }}
        run: |
          # Releases come only from master (minor/major) and release/X.Y.x (patch). A patch from master would
          # publish the next minor's code under the maintenance line's next version and block that line forever,
          # because v* tags are immutable.
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "master" ]]; then
            if [[ "$BUMP" == "patch" ]]; then
              echo "::error::Patch releases come from release/X.Y.x branches. Use minor or major on master."
              exit 1
            fi
          elif [[ ! "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "::error::Releases run only from master or release/X.Y.x, not from $BRANCH."
            exit 1
          fi

          # Only strict vX.Y.Z tags count (#274). A glob such as v[0-9]*.[0-9]*.[0-9]* also matches valid tag names like
          # "v1.0.5$h{...}", and tag-derived values reach bash arithmetic below and perl in the docs step.
          strict_tags() { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; }

          # Resume detection: first compute target VERSION, then check if its tag exists.
          # If tag exists, resume if:
          #   (a) HEAD is tagged (normal resume after tag push, before CHANGELOG)
          #   (b) HEAD commit is the workflow-generated CHANGELOG commit "chore: update CHANGELOG.md for v$VERSION"
          # Otherwise, it's an unrelated commit - don't resume, and error if tag exists on another commit.
          LAST_TAG=$(git tag --merged HEAD | strict_tags | sort -V | tail -1)
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"

          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          # Defense in depth: the version is used in later steps, so it must be plain digits and dots.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '$VERSION' is not of the form X.Y.Z."
            exit 1
          fi

          # A release/X.Y.x branch may only publish X.Y.* versions.
          if [[ "$BRANCH" =~ ^release/([0-9]+)\.([0-9]+)\.x$ ]]; then
            LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if [[ "$VERSION" != "$LINE".* ]]; then
              echo "::error::Version $VERSION does not belong to branch $BRANCH (expected $LINE.*). Use a patch bump."
              exit 1
            fi
          fi

          # Resume detection: compute target VERSION first, then check if v$VERSION tag exists.
          # Resume ONLY if:
          #   (a) HEAD has the exact target tag v$VERSION (normal resume after tag push)
          #   (b) HEAD is the workflow-generated CHANGELOG commit AND v$VERSION is its ancestor,
          #       AND the commit changes ONLY CHANGELOG.md
          # Otherwise fail if the target tag exists elsewhere.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # Target tag exists - check if we should resume
            if git tag --points-at HEAD | strict_tags | grep -qx "v$VERSION"; then
              # HEAD has the exact target tag: normal resume (tag pushed, failed before CHANGELOG/GitHub Release)
              RESUME=true
              LAST_TAG=$({ git tag --merged 'HEAD^' 2>/dev/null || true; } | strict_tags | sort -V | tail -1)
              LAST_TAG="${LAST_TAG:-v0.0.0}"
              echo "::notice::HEAD is tagged v$VERSION: resuming the release of $VERSION. The bump type is ignored and nothing is uploaded again."
            elif git merge-base --is-ancestor "v$VERSION" HEAD \
                 && git log -1 --format=%s | grep -qx "chore: update CHANGELOG.md for v$VERSION" \
                 && git diff --name-only HEAD^ HEAD | grep -qx CHANGELOG.md \
                 && ! git diff --name-only HEAD^ HEAD | grep -vqx CHANGELOG.md; then
              # HEAD is workflow CHANGELOG commit, target tag is ancestor, and commit changes ONLY CHANGELOG.md
              RESUME=true
              LAST_TAG=$({ git tag --merged 'v$VERSION^' 2>/dev/null || true; } | strict_tags | sort -V | tail -1)
              LAST_TAG="${LAST_TAG:-v0.0.0}"
              echo "::notice::HEAD is workflow CHANGELOG commit for v$VERSION: resuming the release of $VERSION. The bump type is ignored and nothing is uploaded again."
            else
              # Target tag exists but we're not on it or its legitimate CHANGELOG continuation
              echo "::error::Tag v$VERSION already exists on another commit (not HEAD or workflow CHANGELOG commit)."
              exit 1
            fi
          else
            RESUME=false
            # Sanity check: target tag should not exist if we're not resuming
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists on another commit."
              exit 1
            fi
          fi

          # Commit time in UTC for reproducible builds (project.build.outputTimestamp).
          TIMESTAMP=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)

          {
            echo "version=$VERSION"
            echo "last_tag=$LAST_TAG"
            echo "timestamp=$TIMESTAMP"
            echo "resume=$RESUME"
          } >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST_TAG, release version: $VERSION, output timestamp: $TIMESTAMP, resume: $RESUME"

      # Step 2: Build and run all tests and quality gates without any secrets in the environment.
      # The release profile also builds the sources and javadoc jars here (signing skipped).
      # No site:site here: it ran after the upload, so a site failure left a published but untagged version.
      # The site is built and published by build.yaml.
      # Step outputs reach the shell through env, never through ${{ }} inside run (no script injection).
      - name: Build and Verify
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          TIMESTAMP: ${{ steps.release_version.outputs.timestamp }}
        run: >-
          mvn -B -P release clean verify -Dgpg.skip
          -Drevision="$VERSION"
          -Dproject.build.outputTimestamp="$TIMESTAMP"

      # Writes <server id="central"> into settings.xml (credentials read from the env vars below at build time)
      # and imports the GPG signing key into the runner's keyring, only after the tests have run.
      - name: Setup Maven Central Credentials & GPG Key
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Step 3: Sign and upload to the Maven Central Portal (primary). Tests already passed in step 2.
      - name: Sign and Publish to Maven Central
        if: steps.release_version.outputs.resume == 'false'
        run: >-
          mvn -B -P release,central deploy -DskipTests
          -Drevision="$VERSION"
          -Dproject.build.outputTimestamp="$TIMESTAMP"
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          TIMESTAMP: ${{ steps.release_version.outputs.timestamp }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # Step 4: Tag the released commit and push only the tag (token passed to this command only).
      # Right after the upload, so every later failure leaves the tag that lets a re-run resume this release.
      - name: Tag and Push Release
        if: steps.release_version.outputs.resume == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      # Resume only: sign the rebuilt jars for the GitHub Release without uploading them again. The build is
      # reproducible (same commit and outputTimestamp), so the jars match the ones published to Central.
      - name: Sign Release Artifacts (resume)
        if: steps.release_version.outputs.resume == 'true'
        run: >-
          mvn -B -P release verify -DskipTests
          -Drevision="$VERSION"
          -Dproject.build.outputTimestamp="$TIMESTAMP"
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          TIMESTAMP: ${{ steps.release_version.outputs.timestamp }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # SLSA build provenance for the released jars and POM: records which workflow, commit and runner built them.
      # The POM is target/<artifact>-<version>.pom: the gpg plugin copies the published (flattened) POM there and
      # signs that copy, so it is exactly the file next to its .asc.
      # Stored as a GitHub attestation and attached to the GitHub Release (*.intoto.jsonl).
      # Verify with: gh attestation verify <jar> --repo nikolas-charalambidis/facepalm-maven-plugin
      - name: Attest Build Provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/facepalm-maven-plugin-${{ steps.release_version.outputs.version }}*.jar
            target/facepalm-maven-plugin-${{ steps.release_version.outputs.version }}.pom
            target/facepalm-maven-plugin-${{ steps.release_version.outputs.version }}-cyclonedx.json
            target/facepalm-maven-plugin-${{ steps.release_version.outputs.version }}-cyclonedx.xml

      # Step 5: Generate release notes with git-cliff (for GitHub Release)
      - name: Generate Release Notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
          LAST_TAG: ${{ steps.release_version.outputs.last_tag }}
        run: |
          git-cliff --config cliff.toml --tag "v$VERSION" --unreleased --output RELEASE_NOTES.md

      # Step 6: Update CHANGELOG.md (prepend new version with SAFE conflict resolution)
      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
          LAST_TAG: ${{ steps.release_version.outputs.last_tag }}
        run: |
          # Skip if version section already exists (idempotent)
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "Version $VERSION section already exists in CHANGELOG.md, skipping prepend."
          else
            # Generate the new changelog entry (version section only, no header/footer/Unreleased)
            git-cliff --config cliff.toml --unreleased --prepend CHANGELOG.md

            # Check if CHANGELOG.md changed
            if git diff --quiet CHANGELOG.md; then
              echo "CHANGELOG.md unchanged, skipping commit."
              exit 0
            fi

            # SAFE conflict resolution: fetch latest, rebase/merge, explicit conflict detection
            # GitHub Actions concurrency (group: release) serializes runs, but concurrent
            # forward.yaml pushes could still race. We handle this safely:
            git fetch origin "$GITHUB_REF_NAME"

            # Try fast-forward first (most common case: no concurrent changes)
            if git merge --ff-only "origin/$GITHUB_REF_NAME" --no-edit; then
              echo "Fast-forwarded to latest origin/$GITHUB_REF_NAME"
            else
              # Fast-forward failed: check if our CHANGELOG change conflicts
              # Use || to capture exit code safely under 'set -e' (GitHub Actions default)
              MERGE_TREE_OUTPUT=$(git merge-tree --write-tree HEAD "origin/$GITHUB_REF_NAME" 2>&1) || MERGE_TREE_EXIT=$?
              if [[ $MERGE_TREE_EXIT -eq 1 ]] && echo "$MERGE_TREE_OUTPUT" | grep -q "CONFLICT (content).*CHANGELOG.md"; then
                echo "::error::CHANGELOG.md conflict detected with concurrent forward-port. Manual resolution required."
                exit 1
              elif [[ $MERGE_TREE_EXIT -eq 129 ]]; then
                echo "::error::git merge-tree usage error: $MERGE_TREE_OUTPUT"
                exit 1
              elif [[ $MERGE_TREE_EXIT -eq 1 ]]; then
                echo "::error::Unexpected merge conflict detected (not in CHANGELOG.md). Manual resolution required."
                echo "Merge output: $MERGE_TREE_OUTPUT"
                exit 1
              fi
              # No CHANGELOG conflict: safe to merge normally
              git merge "origin/$GITHUB_REF_NAME" --no-edit -m "Merge origin/$GITHUB_REF_NAME into release branch"
              echo "Merged concurrent changes (no CHANGELOG conflict)"
            fi

            # Verify CHANGELOG.md still has our changes
            if ! git diff --quiet HEAD CHANGELOG.md; then
              echo "CHANGELOG.md changes preserved after merge."
            else
              echo "::error::CHANGELOG.md changes lost during merge."
              exit 1
            fi

            git commit -am "chore: update CHANGELOG.md for v$VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$GITHUB_REF_NAME"
          fi

      # Step 7: GitHub Release with notes generated from merged PRs since the previous tag on this branch, plus the signed artifacts.
      # Only the highest version is marked "latest", so a patch release on release/X.Y.x does not hide a newer master release.
      - name: Create GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
          LAST_TAG: ${{ steps.release_version.outputs.last_tag }}
          TIMESTAMP: ${{ steps.release_version.outputs.timestamp }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "target/facepalm-maven-plugin-$VERSION.intoto.jsonl"
          HIGHEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=$([ "$HIGHEST" = "v$VERSION" ] && echo true || echo false)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          # A resumed run keeps a release created before the failure, with its original artifacts.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists; keeping it."
            exit 0
          fi
          START=()
          if [ "$LAST_TAG" != "v0.0.0" ]; then START=(--notes-start-tag "$LAST_TAG"); fi
          # Byte-for-byte reproduction needs the same JDK patch version (javadoc bundles JDK-specific resources).
          JDK=$(java -XshowSettings:properties -version 2>&1 | awk -F' = ' '/java.vendor.version/ {v=$2} /java.runtime.version/ {r=$2} END {print (v != "" ? v : r)}')
          # --target records the released branch; without it, GitHub shows the default branch (master) as the target.
          gh release create "v$VERSION" --verify-tag --target "$GITHUB_REF_NAME" --title "$VERSION" --latest="$LATEST" \
            --notes-file RELEASE_NOTES.md \
            --notes "Built with JDK $JDK and \`-Dproject.build.outputTimestamp=$TIMESTAMP\`." \
            target/facepalm-maven-plugin-"$VERSION"*.jar target/facepalm-maven-plugin-"$VERSION".pom \
            target/facepalm-maven-plugin-"$VERSION"-cyclonedx.json target/facepalm-maven-plugin-"$VERSION"-cyclonedx.xml \
            target/facepalm-maven-plugin-"$VERSION"*.asc target/facepalm-maven-plugin-"$VERSION".intoto.jsonl

      # Step 6: Propose the new version in the documentation (README and docs/*.md install snippets).
      # Only for the highest version, so a patch on an older line (e.g. 1.0.3 after 1.1.0) leaves master alone.
      # The PR targets master directly (forward.yaml is not involved). Merge it after publishing the deployment in the
      # Maven Central Portal, so the documentation never points to an unpublished version.
      # The facepalm-bot App token is used because pull requests opened with GITHUB_TOKEN do not trigger build.yaml,
      # whose check is required on master.
      - name: Create GitHub App Token
        id: app-token
        if: steps.github_release.outputs.latest == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FORWARD_APP_ID }}
          private-key: ${{ secrets.FORWARD_APP_PRIVATE_KEY }}
          # Only what the documentation PR needs, not every permission of the installation.
          permission-contents: write      # Push the docs/version-X.Y.Z branch
          permission-pull-requests: write # Open the PR

      - name: Open Documentation Version PR
        if: steps.github_release.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="docs/version-$VERSION"
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout -B "$BRANCH" origin/master
          # Replace only the version that directly follows this plugin's artifactId.
          for f in README.md docs/*.md; do
            # The version comes from the environment, so it is data, never perl code (#274).
            perl -0pi -e 's#(<artifactId>facepalm-maven-plugin</artifactId>\s*<version>)[^<]+(</version>)#${1}$ENV{VERSION}${2}#g' "$f"
          done
          # The self-scan of this repository (#189). Only the property: the regex above would also hit the project's own <version>${revision}</version>.
          perl -pi -e 's#(<facepalm-maven-plugin\.version>)[^<]+(</facepalm-maven-plugin\.version>)#${1}$ENV{VERSION}${2}#' pom.xml
          if git diff --quiet; then
            echo "Documentation already uses $VERSION."
            exit 0
          fi
          git commit -am "docs: use version $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')" ]; then
            echo "Pull request for $BRANCH already open; branch updated."
            exit 0
          fi
          gh pr create --base master --head "$BRANCH" --title "docs: use version $VERSION" --body "$(cat <<EOF2
          Updates the plugin version in the README and docs install snippets, and the self-scan version in \`pom.xml\`, to \`$VERSION\` (released by the release workflow).

          **Merge only after the $VERSION deployment is published in the [Maven Central Portal](https://central.sonatype.com/publishing/deployments)**, so the documentation never points to an unpublished version and the CI build can resolve the self-scan plugin. Check: https://repo1.maven.org/maven2/dev/nichar/facepalm-maven-plugin/$VERSION/
          EOF2
          )"
EOF