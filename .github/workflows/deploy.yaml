name: Release & Deploy

# The version is never stored in pom.xml (it holds the ${revision} placeholder).
# It is derived from the latest vX.Y.Z tag reachable from the selected branch, bumped by the chosen type,
# passed to Maven as -Drevision, and recorded only as a git tag. No commits are pushed back.
# Run it from the branch you want to release (master or release/X.Y.x) via the "Use workflow from" selector.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release at a time: concurrent runs would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # REQUIRED: Allows the bot to push the release tag

jobs:
  release:
    name: Automate Release and Tag
    runs-on: ubuntu-26.04
    steps:
      # Secrets never coexist with test execution: tests run first without any credentials, GPG key or persisted
      # git token; the signing key and Central credentials are installed only afterwards, and the deploy skips tests.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches all history and tags so git describe works
          persist-credentials: false # The token is passed to the tag push only, not stored in .git/config.

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Configure Git Bot User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 1: Derive the release version from the latest reachable tag and the chosen bump type
      - name: Calculate Release Version
        id: release_version
        env:
          BUMP: ${{ github.event.inputs.bump_type }}
        run: |
          # Releases come only from master (minor/major) and release/X.Y.x (patch). A patch from master would
          # publish the next minor's code under the maintenance line's next version and block that line forever,
          # because v* tags are immutable.
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "master" ]]; then
            if [[ "$BUMP" == "patch" ]]; then
              echo "::error::Patch releases come from release/X.Y.x branches. Use minor or major on master."
              exit 1
            fi
          elif [[ ! "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "::error::Releases run only from master or release/X.Y.x, not from $BRANCH."
            exit 1
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"

          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          # A release/X.Y.x branch may only publish X.Y.* versions.
          if [[ "$BRANCH" =~ ^release/([0-9]+)\.([0-9]+)\.x$ ]]; then
            LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if [[ "$VERSION" != "$LINE".* ]]; then
              echo "::error::Version $VERSION does not belong to branch $BRANCH (expected $LINE.*). Use a patch bump."
              exit 1
            fi
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

          # Commit time in UTC for reproducible builds (project.build.outputTimestamp).
          TIMESTAMP=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Last tag: $LAST_TAG, release version: $VERSION, output timestamp: $TIMESTAMP"

      # Step 2: Build and run all tests and quality gates without any secrets in the environment.
      # The release profile also builds the sources and javadoc jars here (signing skipped).
      # No site:site here: it ran after the upload, so a site failure left a published but untagged version.
      # The site is built and published by build.yaml.
      - name: Build and Verify
        run: >-
          mvn -B -P release clean verify -Dgpg.skip
          -Drevision=${{ steps.release_version.outputs.version }}
          -Dproject.build.outputTimestamp=${{ steps.release_version.outputs.timestamp }}

      # Writes <server id="central"> into settings.xml (credentials read from the env vars below at build time)
      # and imports the GPG signing key into the runner's keyring, only after the tests have run.
      - name: Setup Maven Central Credentials & GPG Key
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Step 3: Sign and upload to the Maven Central Portal (primary). Tests already passed in step 2.
      - name: Sign and Publish to Maven Central
        run: >-
          mvn -B -P release,central deploy -DskipTests
          -Drevision=${{ steps.release_version.outputs.version }}
          -Dproject.build.outputTimestamp=${{ steps.release_version.outputs.timestamp }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Step 4: Tag the released commit and push only the tag (token passed to this command only)
      - name: Tag and Push Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      # Step 5: GitHub Release with notes generated from merged PRs since the previous tag on this branch, plus the signed artifacts.
      # Only the highest version is marked "latest", so a patch release on release/X.Y.x does not hide a newer master release.
      - name: Create GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
          LAST_TAG: ${{ steps.release_version.outputs.last_tag }}
          TIMESTAMP: ${{ steps.release_version.outputs.timestamp }}
        run: |
          HIGHEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          LATEST=$([ "$HIGHEST" = "v$VERSION" ] && echo true || echo false)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          START=()
          if [ "$LAST_TAG" != "v0.0.0" ]; then START=(--notes-start-tag "$LAST_TAG"); fi
          # Byte-for-byte reproduction needs the same JDK patch version (javadoc bundles JDK-specific resources).
          JDK=$(java -XshowSettings:properties -version 2>&1 | awk -F' = ' '/java.vendor.version/ {v=$2} /java.runtime.version/ {r=$2} END {print (v != "" ? v : r)}')
          gh release create "v$VERSION" --verify-tag --title "$VERSION" --generate-notes "${START[@]}" --latest="$LATEST" \
            --notes "Built with JDK $JDK and \`-Dproject.build.outputTimestamp=$TIMESTAMP\`." \
            target/facepalm-maven-plugin-"$VERSION"*.jar target/facepalm-maven-plugin-"$VERSION"*.asc

      # Step 6: Propose the new version in the documentation (README and docs/*.md install snippets).
      # Only for the highest version, so a patch on an older line (e.g. 1.0.3 after 1.1.0) leaves master alone.
      # The PR targets master directly (forward.yaml is not involved). Merge it after publishing the deployment in the
      # Maven Central Portal, so the documentation never points to an unpublished version.
      # The facepalm-bot App token is used because pull requests opened with GITHUB_TOKEN do not trigger build.yaml,
      # whose check is required on master.
      - name: Create GitHub App Token
        id: app-token
        if: steps.github_release.outputs.latest == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FORWARD_APP_ID }}
          private-key: ${{ secrets.FORWARD_APP_PRIVATE_KEY }}

      - name: Open Documentation Version PR
        if: steps.github_release.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="docs/version-$VERSION"
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout -B "$BRANCH" origin/master
          # Replace only the version that directly follows this plugin's artifactId.
          for f in README.md docs/*.md; do
            perl -0pi -e 's#(<artifactId>facepalm-maven-plugin</artifactId>\s*<version>)[^<]+(</version>)#${1}'"$VERSION"'${2}#g' "$f"
          done
          if git diff --quiet; then
            echo "Documentation already uses $VERSION."
            exit 0
          fi
          git commit -am "docs: use version $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')" ]; then
            echo "Pull request for $BRANCH already open; branch updated."
            exit 0
          fi
          gh pr create --base master --head "$BRANCH" --title "docs: use version $VERSION" --body "$(cat <<EOF2
          Updates the plugin version in the README and docs install snippets to \`$VERSION\` (released by the release workflow).

          **Merge only after the $VERSION deployment is published in the [Maven Central Portal](https://central.sonatype.com/publishing/deployments)**, so the documentation never points to an unpublished version. Check: https://repo1.maven.org/maven2/dev/nichar/facepalm-maven-plugin/$VERSION/
          EOF2
          )"
