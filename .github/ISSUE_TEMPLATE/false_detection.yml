name: Missed or wrong detection
description: A secret was not found, or something harmless was flagged.
labels: [ "bug" ]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - A secret was NOT detected
        - Something that is not a secret WAS flagged
        - It was detected, but with the wrong severity
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: The line (with the secret replaced)
      description: Never paste a real secret. Keep its prefix and length, but replace the other characters with fake ones.
      placeholder: |
        # src/main/resources/application.yml
        api-key: abc_FAKE0FAKE0FAKE0FAKE
      render: text
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else? (optional)
      description: Plugin version, the finding from the output, what you expected.
