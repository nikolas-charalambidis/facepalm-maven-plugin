name: Bug report
description: The plugin fails or does something unexpected.
labels: [ "bug" ]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you saw (error or output), and what you expected.
      placeholder: |
        I ran `mvn verify` and the build failed with: ...
        I expected: ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions (optional)
      description: Plugin, Maven and Java versions, if you know them (`mvn -v`).
      placeholder: "plugin 1.0.2, Maven 3.9.12, Java 17"
